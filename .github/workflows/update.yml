# Rebuilds meta.json every day. Smogon posts new usage stats once a month, so most runs find nothing new
# and commit nothing. Can also be run by hand from the Actions tab ("Run workflow").
name: Update usage stats

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build meta.json
        run: python3 build_meta.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet meta.json; then
            git add meta.json
            git commit -m "Usage stats for $(python3 -c 'import json; print(json.load(open("meta.json"))["month"])')"
            git push
          # GitHub pauses scheduled jobs after 60 days without commits, so leave a small one every 50 days.
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git commit --allow-empty -m "Keep the daily update running"
            git push
          fi
